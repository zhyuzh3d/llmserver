version: 1
server:
    listen: 0.0.0.0:4815
    admin_listen: 127.0.0.1:4816
    state_path: ../var/llmserver.db
clients:
    - id: local-dev
      allowed_deployments:
        - luna
        - terra
        - sol
        - codex-luna
        - codex-terra
        - codex-sol
        - workbuddy-hy4-preview
providers:
    - id: api-openai
      type: openai_responses
      display_name: AImesh-OpenAI
      base_url: https://ai.ai-mesh.cn
      api_key_header: Authorization
      api_key_prefix: Bearer
      wire_api: responses
      default_public_price:
        revision: api-openai-default-1788154108633
        currency: USD
        input_per_million: "2.000000"
        output_per_million: "12.000000"
        source: configured
    - id: codex-local
      type: codex_exec
      display_name: Codex
      executable: /Applications/ChatGPT.app/Contents/Resources/codex
      expected_version: codex-cli 0.151.
      max_concurrency: 2
      default_reasoning_effort: low
      service_tier: priority
      default_public_price:
        revision: codex-local-default-1788155856746
        currency: USD
        input_per_million: "2.00"
        output_per_million: "12.00"
        source: configured
    - id: workbuddy-local
      type: workbuddy_exec
      display_name: WorkBuddy
      executable: /Applications/WorkBuddy.app/Contents/Resources/app.asar.unpacked/cli/bin/codebuddy
      expected_version: 2.132.
      max_concurrency: 2
      default_reasoning_effort: high
      warmup_enabled: true
      warmup_model: hy4-preview
      warmup_timeout_seconds: 30
      default_public_price:
        revision: workbuddy-local-default-1788155868655
        currency: USD
        input_per_million: "2.00"
        output_per_million: "12.00"
        source: configured
deployments:
    - id: luna
      provider_id: api-openai
      upstream_model: gpt-5.6-luna
      supported_reasoning_efforts:
        - none
        - low
        - medium
        - high
        - xhigh
        - max
      price:
        revision: luna-public-v1
        currency: USD
        input_per_million: "0.200000"
        output_per_million: "1.200000"
        source: configured
      actual_price:
        revision: luna-upstream-v1
        currency: USD
        input_per_million: "0.200000"
        output_per_million: "1.200000"
        source: configured_estimate
      hard_budget_supported: true
      enabled: true
    - id: terra
      provider_id: api-openai
      upstream_model: gpt-5.6-terra
      supported_reasoning_efforts:
        - none
        - low
        - medium
        - high
        - xhigh
        - max
      price:
        revision: terra-public-v1
        currency: USD
        input_per_million: "2.000000"
        output_per_million: "12.000000"
        source: configured
      actual_price:
        revision: terra-upstream-v1
        currency: USD
        input_per_million: "2.000000"
        output_per_million: "12.000000"
        source: configured_estimate
      hard_budget_supported: true
      enabled: true
    - id: sol
      provider_id: api-openai
      upstream_model: gpt-5.6-sol
      supported_reasoning_efforts:
        - none
        - low
        - medium
        - high
        - xhigh
        - max
      price:
        revision: sol-public-v1
        currency: USD
        input_per_million: "4.000000"
        output_per_million: "20.000000"
        source: configured
      actual_price:
        revision: sol-upstream-v1
        currency: USD
        input_per_million: "4.000000"
        output_per_million: "20.000000"
        source: configured_estimate
      hard_budget_supported: true
      enabled: true
    - id: codex-luna
      provider_id: codex-local
      upstream_model: gpt-5.6-luna
      supported_reasoning_efforts:
        - low
        - medium
        - high
        - xhigh
        - max
      price:
        revision: codex-luna-public-v1
        currency: USD
        input_per_million: "0.200000"
        output_per_million: "1.200000"
        source: configured
      hard_budget_supported: false
      enabled: true
    - id: codex-terra
      provider_id: codex-local
      upstream_model: gpt-5.6-terra
      supported_reasoning_efforts:
        - low
        - medium
        - high
        - xhigh
        - max
        - ultra
      price:
        revision: codex-terra-public-v1
        currency: USD
        input_per_million: "2.000000"
        output_per_million: "12.000000"
        source: configured
      hard_budget_supported: false
      enabled: true
    - id: codex-sol
      provider_id: codex-local
      upstream_model: gpt-5.6-sol
      supported_reasoning_efforts:
        - low
        - medium
        - high
        - xhigh
        - max
        - ultra
      price:
        revision: codex-sol-public-v1
        currency: USD
        input_per_million: "4.000000"
        output_per_million: "20.000000"
        source: configured
      hard_budget_supported: false
      enabled: true
    - id: workbuddy-hy4-preview
      provider_id: workbuddy-local
      upstream_model: hy4-preview
      supported_reasoning_efforts:
        - high
      price:
        revision: workbuddy-hy4-preview-public-v1
        currency: USD
        input_per_million: "2.000000"
        output_per_million: "12.000000"
        source: configured
      hard_budget_supported: false
      enabled: true
