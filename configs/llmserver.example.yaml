server:
  listen: 127.0.0.1:4815
  state_path: ../var/llmserver.db

xconfig_import:
  enabled: true
  path: ../../xconfig.yaml
  provider_id: api-openai

clients:
  - id: local-dev
    token_env: LLMSERVER_CLIENT_TOKEN
    allowed_deployments: [luna, terra, sol, codex-luna, codex-terra, codex-sol, workbuddy-hy4-preview]
    include_quota_observations: false

# A manual price creates a new public price revision and overrides the imported
# catalog default. Supplier-reported prices never change public billing.
manual_prices: []

providers:
  - id: codex-local
    type: codex_exec
    display_name: Local Codex subscription
    executable: /Applications/ChatGPT.app/Contents/Resources/codex
    expected_version: "codex-cli 0.151."
    observe_quota: true
  - id: workbuddy-local
    type: workbuddy_exec
    display_name: Local WorkBuddy subscription
    executable: /Applications/WorkBuddy.app/Contents/Resources/app.asar.unpacked/cli/bin/codebuddy
    expected_version: "2.115."

# Codex prices are llmserver's public configured prices. The caller is not
# told whether a price came from an API catalog or a manual subscription rule.
deployments:
  - id: codex-luna
    provider_id: codex-local
    upstream_model: gpt-5.6-luna
    supported_reasoning_efforts: [low, medium, high, xhigh, max]
    hard_budget_supported: false
    enabled: true
    price:
      revision: codex-luna-public-v1
      currency: USD
      input_per_million: "0.200000"
      output_per_million: "1.200000"
      source: manual_override
  - id: codex-terra
    provider_id: codex-local
    upstream_model: gpt-5.6-terra
    supported_reasoning_efforts: [low, medium, high, xhigh, max, ultra]
    hard_budget_supported: false
    enabled: true
    price:
      revision: codex-terra-public-v1
      currency: USD
      input_per_million: "2.000000"
      output_per_million: "12.000000"
      source: manual_override
  - id: codex-sol
    provider_id: codex-local
    upstream_model: gpt-5.6-sol
    supported_reasoning_efforts: [low, medium, high, xhigh, max, ultra]
    hard_budget_supported: false
    enabled: true
    price:
      revision: codex-sol-public-v1
      currency: USD
      input_per_million: "4.000000"
      output_per_million: "20.000000"
      source: manual_override
  - id: workbuddy-hy4-preview
    provider_id: workbuddy-local
    upstream_model: hy4-preview
    supported_reasoning_efforts: [minimal, low, medium, high, xhigh, max]
    hard_budget_supported: false
    enabled: true
    price:
      revision: workbuddy-hy4-preview-public-v1
      currency: USD
      input_per_million: "2.000000"
      output_per_million: "12.000000"
      source: manual_override
